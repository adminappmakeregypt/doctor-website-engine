<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>إنشاء العيادة التجريبية</title>
<link rel="stylesheet" href="styles.css?v=1" />
</head>
<body>
<div class="container" style="padding:40px 0;max-width:640px">
  <div class="card">
    <h2 style="margin-top:0">إنشاء العيادة التجريبية</h2>
    <p class="sub">سجّل الدخول بحساب له صلاحية الكتابة، ثم اضغط الزر لإنشاء بيانات الموقع التجريبي
      <strong>dr-ahmed</strong>.</p>
    <div class="grid" style="gap:10px">
      <input id="em" type="email" placeholder="البريد الإلكتروني" style="padding:10px;border:1px solid #e3e8ef;border-radius:10px" />
      <input id="pw" type="password" placeholder="كلمة المرور" style="padding:10px;border:1px solid #e3e8ef;border-radius:10px" />
      <input id="cid" type="text" value="demo-clinic" placeholder="معرّف العيادة clinicId" style="padding:10px;border:1px solid #e3e8ef;border-radius:10px" />
      <input id="slug" type="text" value="dr-ahmed" placeholder="الرابط slug" style="padding:10px;border:1px solid #e3e8ef;border-radius:10px" />
      <button class="btn btn-primary" id="go">إنشاء البيانات التجريبية</button>
      <p id="msg" style="margin:0;color:#64748b"></p>
    </div>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = (id) => document.getElementById(id);

$("go").addEventListener("click", async () => {
  const msg = $("msg");
  const clinicId = $("cid").value.trim();
  const slug = $("slug").value.trim().toLowerCase();
  msg.textContent = "جارٍ التنفيذ…";
  try {
    await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value);

    await setDoc(doc(db, "clinics", clinicId, "websiteSettings", "main"), {
      isWebsiteEnabled: true,
      slug,
      doctorName: "د. أحمد محمد",
      doctorTitle: "استشاري جراحة العظام",
      specialty: "جراحة العظام",
      subSpecialty: "إصابات الملاعب",
      shortIntro: "رعاية طبية متخصصة لعلاج إصابات العظام والمفاصل بأحدث الأساليب.",
      profileImage: "",
      coverImage: "",
      logo: "",
      aboutDoctor: "طبيب استشاري بخبرة تزيد عن 15 عاماً في جراحة العظام وإصابات الملاعب.",
      qualifications: "بكالوريوس الطب والجراحة\nماجستير جراحة العظام\nزمالة إصابات الملاعب",
      experience: "أكثر من 15 عاماً من الخبرة العملية داخل وخارج مصر.",
      clinicName: "عيادة الدكتور أحمد لجراحة العظام",
      phone: "01000000000",
      whatsapp: "201000000000",
      email: "info@example.com",
      address: "١٥ شارع الجمهورية، وسط البلد، القاهرة",
      googleMapsUrl: "https://maps.google.com",
      socialMedia: { facebook: "https://facebook.com", instagram: "" },
      workingHours: {
        saturday: { open: "10:00", close: "20:00" },
        sunday: { open: "10:00", close: "20:00" },
        monday: { open: "10:00", close: "20:00" },
        tuesday: { closed: true },
        wednesday: { open: "10:00", close: "20:00" },
        thursday: { open: "10:00", close: "16:00" },
        friday: { closed: true }
      },
      themeSettings: { primaryColor: "#0f766e" },
      updatedAt: Date.now()
    }, { merge: true });

    await setDoc(doc(db, "websiteDirectory", slug), { clinicId, slug, updatedAt: Date.now() }, { merge: true });

    const services = [
      { id: "s1", name: "كشف عظام", description: "فحص شامل وتشخيص دقيق للحالة.", price: "300 ج.م", duration: "20 دقيقة", order: 1, isActive: true },
      { id: "s2", name: "حقن المفاصل", description: "علاج خشونة وآلام المفاصل بالحقن.", price: "600 ج.م", duration: "30 دقيقة", order: 2, isActive: true },
      { id: "s3", name: "علاج الكسور والتجبير", description: "تثبيت وتجبير الكسور ومتابعتها.", price: "", duration: "45 دقيقة", order: 3, isActive: true }
    ];
    for (const s of services) {
      const { id, ...data } = s;
      await setDoc(doc(db, "clinics", clinicId, "services", id), data, { merge: true });
    }

    msg.textContent = "تم ✔ — افتح: " + location.origin + location.pathname.replace(/seed-demo\.html$/, "") + "index.html?slug=" + slug;
  } catch (e) {
    msg.textContent = "خطأ: " + (e && e.message ? e.message : e);
  }
});
</script>
</body>
</html>
